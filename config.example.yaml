# ============================================================================
# 工具组配置 (tool_groups)
# ============================================================================
# 工具组用于组织和分组工具，Agent 可以按组选择工具
tool_groups:
- name: web              # Web 工具组（搜索、爬虫等）
- name: file:read       # 文件读取工具组
- name: file:write      # 文件写入工具组
- name: bash            # 命令行工具组

# ============================================================================
# 工具配置 (tools)
# ============================================================================
# 具体工具配置，name 为工具标识符，group 为所属组，use 为工具类路径
tools:
# - name: image_search
#   group: web
#   use: deerflow.community.image_search.tools:image_search_tool
#   max_results: 5

- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool

- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool

- name: write_file
  group: file:write
  use: deerflow.sandbox.tools:write_file_tool

- name: str_replace
  group: file:write
  use: deerflow.sandbox.tools:str_replace_tool

- name: bash
  group: bash
  use: deerflow.sandbox.tools:bash_tool

- name: knowledge_search
  group: knowledge
  use: deerflow.tools.knowledge_search_tool:knowledge_search_tool

- name: tencent_ima
  group: knowledge
  use: deerflow.tools.tencent_ima_tool:tencent_ima_search
  api_url: https://ima.qq.com
  client_id: 710795216c075bbfaa748de8b4ed4877
  api_key: oy1uV9jnknrhLNGghQQQCkdw8ol+azTPcfoOvAVC1pVS9eMNOqDqQ3ryQl08iNyiWwyHfEanAw==
  knowledge_base_id: 

# ============================================================================
# 工具搜索配置 (tool_search)
# ============================================================================
# 自动搜索和推荐相关工具的功能
tool_search:
  enabled: false  # 是否启用工具搜索推荐

# ============================================================================
# 沙箱配置 (sandbox)
# ============================================================================
# 沙箱环境配置，用于安全执行代码和命令
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider  # 沙箱类型
  allow_host_bash: false  # 是否允许在宿主机执行 bash 命令
  bash_output_max_chars: 20000  # bash 输出最大字符数
  read_file_output_max_chars: 50000  # 读取文件输出最大字符数
  ls_output_max_chars: 20000  # ls 命令输出最大字符数

# ============================================================================
# Skills 配置 (skills)
# ============================================================================
# Skills 容器路径配置
skills:
  container_path: /mnt/skills  # Skills 容器挂载路径

# ============================================================================
# 会话标题生成配置 (title)
# ============================================================================
# 新会话自动生成标题的功能
title:
  enabled: true  # 是否启用标题生成
  max_words: 6   # 标题最大单词数
  max_chars: 60   # 标题最大字符数
  model_name: qwen-plus  # 使用的模型名称（null = 使用默认模型）

# ============================================================================
# 对话摘要配置 (summarization)
# ============================================================================
# 长对话自动摘要功能，避免上下文过长
summarization:
  enabled: true  # 是否启用对话摘要
  model_name:  qwen-plus # 摘要模型（null = 使用轻量级模型）

  # 触发条件配置
  trigger:
    type: tokens        # 触发类型: tokens(基于Token数) 或 messages(基于消息数)
    value: 100000       # 触发阈值

  # 保留消息配置
  keep:
    type: messages     # 保留类型
    value: 10          # 保留最近 N 条消息

  trim_tokens_to_summarize: 15564  # 摘要时处理的 Token 数上限

  summary_prompt: null  # 自定义摘要提示词（null = 使用默认提示词）

  # 保留最近 Skill 调用的配置
  preserve_recent_skill_count: 5  # 保留最近 N 次 Skill 调用
  preserve_recent_skill_tokens: 25000  # Skill 调用相关 Token 总数上限
  preserve_recent_skill_tokens_per_skill: 5000  # 单个 Skill 调用 Token 上限

  # Skill 文件读取工具名称列表
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat

# ============================================================================
# Agents API 配置 (agents_api)
# ============================================================================
# Agent 管理 REST API
agents_api:
  enabled: true  # 是否启用 Agents API

# ============================================================================
# 文件上传配置 (uploads)
# ============================================================================
# 用户文件上传相关限制
uploads:
  max_files: 10              # 单次最大上传文件数
  max_file_size: 52428800    # 单个文件最大大小（字节），约 50MB
  max_total_size: 104857600  # 总上传大小限制（字节），约 100MB
  auto_convert_documents: false  # 是否自动转换文档格式
  pdf_converter: auto        # PDF 转换器: auto, pdftotext, pymupdf

# ============================================================================
# 记忆配置 (memory)
# ============================================================================
# Agent 长期记忆功能，存储用户偏好和对话上下文
memory:
  enabled: true  # 是否启用记忆功能

  storage_path: memory.json  # 记忆存储路径
  # - 绝对路径: 所有用户共享同一文件
  # - 相对路径: 解析为 {base_dir}/storage_path
  # - 空字符串: 使用默认路径 {base_dir}/users/{user_id}/memory.json

  debounce_seconds: 30  # 记忆更新防抖时间（秒），范围 1-300
  # 对话结束后等待 N 秒再更新记忆，避免频繁写入

  model_name: null  # 记忆更新使用的模型（null = 使用默认模型）

  max_facts: 100  # 最大存储事实数量，范围 10-500
  # 超过此数量会删除低置信度的事实

  fact_confidence_threshold: 0.7  # 事实置信度阈值，范围 0.0-1.0
  # 只有置信度 >= 此值的事实才会被存储

  injection_enabled: true  # 是否将记忆注入到 System Prompt

  max_injection_tokens: 2000  # 注入到 System Prompt 的最大 Token 数，范围 100-8000

# ============================================================================
# Skill 自我进化配置 (skill_evolution)
# ============================================================================
# Agent 自动创建和优化 Skills 的功能
skill_evolution:
  enabled: true  # 是否启用 Skill 自进化

  moderation_model_name: qwen-plus  # 审核模型（用于审核生成的 Skill）
  # - null: 不进行审核，直接应用
  # - 指定模型: 使用该模型审核后再应用

# ============================================================================
# 数据库配置 (database)
# ============================================================================
# 应用数据存储后端配置
database:
  backend: sqlite  # 数据库类型: memory(开发), sqlite(单机), postgres(生产)
  sqlite_dir: .deer-flow/data  # SQLite 数据库目录
  
  # Roleplay MySQL 配置
  roleplay_db_host: rm-bp1dd16o34ktj6un0to.mysql.rds.aliyuncs.com
  roleplay_db_port: 3306
  roleplay_db_name: demo_dev_gp
  roleplay_db_user: dl
  roleplay_db_password: Unicz%sav42&sw#

# ============================================================================
# 运行事件配置 (run_events)
# ============================================================================
# 对话运行过程中的事件记录和追踪
run_events:
  backend: memory  # 事件存储后端: memory(无持久化), db(持久化), jsonl(轻量持久化)

  max_trace_content: 10240  # 单个追踪内容的最大字符数

  track_token_usage: true  # 是否追踪 Token 使用量

# ============================================================================
# Subagent 配置 (subagents)
# ============================================================================
# 配置子Agent，用于处理特定类型的任务
subagents:
  timeout_seconds: 900
  custom_agents:
    roleplay:
      description: "角色扮演对练Agent，用于至境E7展厅接待场景对练"
      system_prompt: |
        您是一个专业的AI对练教练Agent，基于知识库内容进行自由对练。
        您的职责是：
        1. 模拟真实客户，与学员进行自然对话
        2. 基于考核维度对学员回复进行评分
        3. 每轮回复后给出简短鼓励或改进建议
        4. 对练结束后生成多维度评估报告
        
        重要规则：
        - 客户角色和场景细节必须来源于知识库搜索结果，不能凭空生成
        - 根据知识库内容的维度自动生成问题，实现自由对练模式
      tools:
        - knowledge_search
      skills:
        - knowledge_search
      model: inherit
      max_turns: 100
      timeout_seconds: 900
