# ============================================================================
# DeerFlow 配置文件 - 完整参数说明
# ============================================================================
# 配置文件版本号，用于版本迁移和校验
config_version: 8

# 日志级别: trace, debug, info, warning, error, critical
log_level: info

# Token 使用量统计
token_usage:
  enabled: false  # 是否启用 Token 使用量统计

# ============================================================================
# 模型配置 (models)
# ============================================================================
# 支持配置多个模型，列表中第一个模型为默认模型
models:

# - name: 模型标识符，在 Agent 配置中通过此名称引用
#   display_name: 前端显示的模型名称
#   use: LangChain 集成类路径
#   model: 实际 API 模型名称
#   api_key: API 密钥
#   base_url: API 基础 URL
#   request_timeout: 请求超时时间（秒）
#   max_retries: 最大重试次数
#   max_tokens: 单次请求最大输出 Token 数
#   temperature: 采样温度 (0.0-2.0)，越低越确定性，越高越随机
#   supports_vision: 是否支持视觉/图片输入
#   supports_thinking: 是否支持思维链/推理模式
#   supports_reasoning_effort: 是否支持推理努力（影响 token 计算）
#   tool_calling: 是否支持工具调用

