# =================================================
# DeerFlow 生产环境 Docker Compose 配置
# 端口说明：
#   - 对练系统后端: 8001 端口
#   - 对练系统前端: 4000 端口
# =================================================

services:
  # 后端服务
  backend:
    image: deerflow-backend:latest
    container_name: deerflow-backend
    ports:
      - "8001:8001"
    environment:
      # 主数据库配置（使用 SQLite）
      - DB_BACKEND=sqlite
      - SQLITE_DIR=/app/.deer-flow/data
      # 对练模块数据库配置（使用云端 MySQL，通过 .env 文件配置）
      - ROLEPLAY_DB_HOST=${ROLEPLAY_DB_HOST:-localhost}
      - ROLEPLAY_DB_PORT=${ROLEPLAY_DB_PORT:-3306}
      - ROLEPLAY_DB_NAME=${ROLEPLAY_DB_NAME:-deer_flow}
      - ROLEPLAY_DB_USER=${ROLEPLAY_DB_USER:-deerflow}
      - ROLEPLAY_DB_PASSWORD=${ROLEPLAY_DB_PASSWORD:-deerflow@2024}
      # 后端配置
      - DEBUG=false
      - PORT=8001
      # JWT 配置
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-your-secure-jwt-secret-here-32-chars-minimum}
      # CORS 配置（允许生产环境前端访问）
      - CORS_ORIGINS=${CORS_ORIGINS:-http://192.168.110.86:4000,http://localhost:4000}
      # LLM 模型配置（供 config.yaml 使用）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-api-key-here}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
    networks:
      - deerflow-network
    restart: always

  # 前端服务
  frontend:
    image: deerflow-frontend:latest
    container_name: deerflow-frontend
    ports:
      - "4000:80"
    networks:
      - deerflow-network
    depends_on:
      - backend
    restart: always

networks:
  deerflow-network:
    driver: bridge