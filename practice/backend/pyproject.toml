[project]
name = "deerflow-practice-backend"
version = "1.0.0"
description = "DeerFlow Roleplay Practice - Standalone Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "dashscope>=1.23.0",
    "oss2>=2.18.0",
    "httpx>=0.28.0",
    "bcrypt>=4.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"
